<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>git-ls-tree</title>
<style>
  :root {
    --ink:        #0a0f0c;
    --ink-2:      #0e1511;
    --ink-3:      #131c16;
    --line:       #1f2d24;
    --line-hi:    #2e4435;
    --text:       #b8c9bc;
    --text-dim:   #5f7565;
    --text-faint: #3c4f42;
    --phosphor:   #4ade80;
    --phosphor-dim: #1d5b3d;
    --amber:      #fbbf24;
    --amber-dim:  #6b5413;
    --sel:        #16271d;
    --mono: "JetBrains Mono", "Cascadia Code", "Fira Code", "SF Mono", ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    background: var(--ink);
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.5;
    overflow: hidden;
  }

  /* faint scanlines + vignette atmosphere */
  body::before {
    content: "";
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 999;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,.14) 0 1px, transparent 1px 3px),
      radial-gradient(ellipse 120% 90% at 50% 40%, transparent 55%, rgba(0,0,0,.5));
    mix-blend-mode: multiply;
  }

  .app {
    display: grid;
    grid-template-columns: 280px 1fr 320px;
    grid-template-rows: auto 1fr;
    grid-template-areas:
      "header header header"
      "side   tree   detail";
    height: 100vh;
  }

  /* ── header ─────────────────────────────────────── */
  header {
    grid-area: header;
    display: flex;
    align-items: baseline;
    gap: 18px;
    padding: 14px 20px 12px;
    border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, var(--ink-2), var(--ink));
  }
  header h1 {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: .04em;
    color: var(--phosphor);
    text-shadow: 0 0 12px rgba(74, 222, 128, .35);
  }
  header h1::before { content: "▌"; animation: blink 1.2s steps(1) infinite; margin-right: 6px; }
  @keyframes blink { 50% { opacity: 0; } }
  header .stats {
    display: flex;
    gap: 16px;
    color: var(--text-dim);
    font-size: 12px;
  }
  header .stats b { color: var(--text); font-weight: 600; }
  header .stamp { margin-left: auto; color: var(--text-faint); font-size: 11px; }

  /* ── sidebar ────────────────────────────────────── */
  aside.side {
    grid-area: side;
    border-right: 1px solid var(--line);
    background: var(--ink-2);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .side .block { padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .side .label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: .18em;
    color: var(--text-faint);
    margin-bottom: 8px;
  }

  #search {
    width: 100%;
    background: var(--ink);
    border: 1px solid var(--line);
    color: var(--text);
    font: inherit;
    padding: 6px 9px;
    outline: none;
    caret-color: var(--phosphor);
  }
  #search:focus { border-color: var(--phosphor); box-shadow: 0 0 0 1px rgba(74,222,128,.25), 0 0 14px rgba(74,222,128,.12); }
  #search::placeholder { color: var(--text-faint); }

  .branch-tools { display: flex; gap: 6px; margin-bottom: 10px; }
  .btn {
    background: var(--ink);
    border: 1px solid var(--line);
    color: var(--text-dim);
    font: inherit;
    font-size: 11px;
    padding: 3px 9px;
    cursor: pointer;
  }
  .btn:hover { border-color: var(--line-hi); color: var(--text); }
  .btn:active { background: var(--ink-3); }

  #branches { overflow-y: auto; flex: 1; min-height: 0; padding: 8px 8px 14px; }
  .branch {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 5px 8px;
    cursor: pointer;
    user-select: none;
    border: 1px solid transparent;
  }
  .branch:hover { background: var(--ink-3); border-color: var(--line); }
  .branch input { display: none; }
  .branch .box {
    width: 13px; height: 13px;
    flex: none;
    border: 1px solid var(--bc, var(--text-dim));
    display: grid;
    place-items: center;
    font-size: 10px;
    color: var(--ink);
    transition: background .12s;
  }
  .branch input:checked + .box { background: var(--bc, var(--phosphor)); }
  .branch input:checked + .box::after { content: "✓"; }
  .branch .name {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--text-dim);
  }
  .branch input:checked ~ .name { color: var(--text); }
  .branch .count { margin-left: auto; color: var(--text-faint); font-size: 11px; }

  /* ── tree ───────────────────────────────────────── */
  main.tree-pane {
    grid-area: tree;
    overflow: auto;
    min-height: 0;
    padding: 12px 20px 60px;
    background:
      radial-gradient(ellipse 80% 50% at 65% 0%, rgba(74,222,128,.04), transparent 60%),
      var(--ink);
  }
  .tree-toolbar {
    display: flex;
    gap: 6px;
    padding: 0 0 10px;
    position: sticky;
    top: 0;
    background: linear-gradient(180deg, var(--ink) 75%, transparent);
    z-index: 5;
  }
  .tree-toolbar .hint { margin-left: auto; color: var(--text-faint); font-size: 11px; align-self: center; }

  ul.tree, ul.tree ul { list-style: none; }
  ul.tree ul {
    margin-left: 9px;
    padding-left: 14px;
    border-left: 1px solid var(--line);
  }
  .node-row {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 2px 8px 2px 4px;
    cursor: pointer;
    border: 1px solid transparent;
    white-space: nowrap;
  }
  .node-row:hover { background: var(--ink-3); border-color: var(--line); }
  .node-row.selected {
    background: var(--sel);
    border-color: var(--line-hi);
    box-shadow: inset 2px 0 0 var(--phosphor);
  }
  .twist {
    width: 12px;
    flex: none;
    color: var(--text-dim);
    font-size: 10px;
    text-align: center;
    transition: transform .12s;
  }
  li.collapsed > .node-row .twist { transform: rotate(-90deg); }
  li.collapsed > ul { display: none; }

  .node-name { color: var(--text); }
  .dir > .node-row .node-name { color: var(--phosphor); }
  .dir > .node-row .node-name::after { content: "/"; color: var(--text-faint); }

  .presence {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 8px;
    padding-left: 18px;
  }
  .dots { display: flex; gap: 3px; }
  .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--bc);
    opacity: .9;
  }
  .dot.off { background: transparent; box-shadow: inset 0 0 0 1px var(--text-faint); opacity: .55; }
  .ratio { font-size: 10px; color: var(--text-faint); min-width: 32px; text-align: right; }
  .partial > .node-row .ratio { color: var(--amber); }
  .partial > .node-row .node-name { text-decoration: underline dotted var(--amber-dim) 1px; text-underline-offset: 3px; }
  .dircount { margin-left: auto; font-size: 10px; color: var(--text-faint); padding-left: 18px; }

  mark { background: transparent; color: var(--amber); font-weight: 700; }

  .empty {
    color: var(--text-dim);
    padding: 40px 8px;
    text-align: center;
  }
  .empty b { color: var(--amber); }

  /* ── detail panel ───────────────────────────────── */
  aside.detail {
    grid-area: detail;
    border-left: 1px solid var(--line);
    background: var(--ink-2);
    overflow-y: auto;
    min-height: 0;
    padding: 16px;
  }
  .detail .placeholder { color: var(--text-faint); margin-top: 30px; text-align: center; }
  .detail .placeholder .glyph { font-size: 30px; display: block; margin-bottom: 12px; color: var(--line-hi); }
  .detail h2 {
    font-size: 12px;
    font-weight: 600;
    color: var(--text);
    word-break: break-all;
    padding-bottom: 12px;
    border-bottom: 1px dashed var(--line);
    margin-bottom: 14px;
  }
  .detail h2 .path-dim { color: var(--text-dim); }
  .detail .section-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: .18em;
    color: var(--text-faint);
    margin: 14px 0 8px;
  }
  .chip {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 8px;
    margin-bottom: 4px;
    border: 1px solid var(--line);
    background: var(--ink);
    font-size: 12px;
  }
  .chip .swatch { width: 8px; height: 8px; flex: none; background: var(--bc); }
  .chip.absent { opacity: .45; }
  .chip.absent .swatch { background: transparent; box-shadow: inset 0 0 0 1px var(--text-dim); }
  .chip.absent .nm { text-decoration: line-through; text-decoration-color: var(--text-faint); }
  .chip .ext { margin-left: auto; font-size: 10px; color: var(--text-faint); }
  .chip-link { display: block; text-decoration: none; color: inherit; }
  .chip-link .chip { transition: border-color .12s; }
  .chip-link:hover .chip { border-color: var(--line-hi); background: var(--ink-3); }
  .chip-link:hover .chip .ext { color: var(--phosphor); }
  .allmsg { font-size: 11px; color: var(--phosphor); margin-top: 10px; }
  .allmsg.partial { color: var(--amber); }

  /* page-load reveal */
  header, .side, .tree-pane, .detail { animation: reveal .5s ease both; }
  .side { animation-delay: .08s; }
  .tree-pane { animation-delay: .16s; }
  .detail { animation-delay: .24s; }
  @keyframes reveal { from { opacity: 0; transform: translateY(6px); } }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--line); border: 2px solid var(--ink); }
  ::-webkit-scrollbar-thumb:hover { background: var(--line-hi); }
  ::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>git-ls-tree</h1>
    <div class="stats" id="stats"></div>
    <div class="stamp" id="stamp"></div>
  </header>

  <aside class="side">
    <div class="block">
      <div class="label">filter paths</div>
      <input id="search" type="text" placeholder="type to filter — / to focus" autocomplete="off" spellcheck="false">
    </div>
    <div class="block" style="border-bottom:none; padding-bottom:6px;">
      <div class="label">branches</div>
      <div class="branch-tools">
        <button class="btn" id="all-branches">all</button>
        <button class="btn" id="no-branches">none</button>
      </div>
    </div>
    <div id="branches"></div>
  </aside>

  <main class="tree-pane">
    <div class="tree-toolbar">
      <button class="btn" id="expand-all">expand all</button>
      <button class="btn" id="collapse-all">collapse all</button>
      <span class="hint" id="visible-count"></span>
    </div>
    <div id="tree-root"></div>
  </main>

  <aside class="detail" id="detail">
    <div class="placeholder"><span class="glyph">⌥</span>select a file to see<br>which branches carry it</div>
  </aside>
</div>

<script>
"use strict";

let DATA = null;            // { repo, generated_at, branches, files }
let branchColors = [];      // css color per branch index
let selectedBranches = new Set();
let nameFilter = "";
let collapsed = new Set();  // folder paths currently collapsed
let selectedPath = null;
let root = null;            // tree model

const $ = (id) => document.getElementById(id);

/* ── data → tree model ──────────────────────────── */

function buildTree(files) {
  const node = { name: "", path: "", dirs: new Map(), files: new Map() };
  for (const [path, branchIdxs] of Object.entries(files)) {
    const parts = path.split("/");
    let cur = node;
    for (let i = 0; i < parts.length - 1; i++) {
      const part = parts[i];
      if (!cur.dirs.has(part)) {
        cur.dirs.set(part, {
          name: part,
          path: cur.path ? cur.path + "/" + part : part,
          dirs: new Map(),
          files: new Map(),
        });
      }
      cur = cur.dirs.get(part);
    }
    cur.files.set(parts[parts.length - 1], new Set(branchIdxs));
  }
  return node;
}

function assignColors(n) {
  // evenly spaced hues, phosphor-leaning saturation
  return Array.from({ length: n }, (_, i) => {
    const hue = Math.round((i * 360) / n + 95) % 360;
    return `hsl(${hue} 65% 62%)`;
  });
}

/* ── filtering ──────────────────────────────────── */

function fileVisible(path, branches) {
  if (nameFilter && !path.toLowerCase().includes(nameFilter)) return false;
  for (const b of branches) if (selectedBranches.has(b)) return true;
  return false;
}

/* ── rendering ──────────────────────────────────── */

function esc(s) {
  return s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

function highlight(name, path) {
  if (!nameFilter) return esc(name);
  // highlight the match if it lands inside the basename
  const idxInPath = path.toLowerCase().indexOf(nameFilter);
  const base = path.length - name.length;
  if (idxInPath < 0 || idxInPath + nameFilter.length <= base) return esc(name);
  const start = Math.max(0, idxInPath - base);
  const end = Math.min(name.length, idxInPath - base + nameFilter.length);
  return esc(name.slice(0, start)) + "<mark>" + esc(name.slice(start, end)) + "</mark>" + esc(name.slice(end));
}

function presenceHTML(branches) {
  const total = DATA.branches.length;
  const dots = DATA.branches
    .map((_, i) => `<span class="dot${branches.has(i) ? "" : " off"}" style="--bc:${branchColors[i]}" title="${esc(DATA.branches[i])}"></span>`)
    .join("");
  const showDots = total <= 12 ? `<span class="dots">${dots}</span>` : "";
  return `<span class="presence">${showDots}<span class="ratio">${branches.size}/${total}</span></span>`;
}

function renderDir(dir) {
  // returns { html, fileCount } — empty html when nothing visible inside
  let inner = "";
  let count = 0;

  const sortedDirs = [...dir.dirs.values()].sort((a, b) => a.name.localeCompare(b.name));
  for (const sub of sortedDirs) {
    const r = renderDir(sub);
    if (!r.fileCount) continue;
    count += r.fileCount;
    const isCollapsed = collapsed.has(sub.path) && !nameFilter; // auto-expand while searching
    inner += `<li class="dir${isCollapsed ? " collapsed" : ""}" data-dir="${esc(sub.path)}">
      <div class="node-row" data-toggle="${esc(sub.path)}">
        <span class="twist">▾</span>
        <span class="node-name">${esc(sub.name)}</span>
        <span class="dircount">${r.fileCount}</span>
      </div>
      <ul>${r.html}</ul>
    </li>`;
  }

  const sortedFiles = [...dir.files.keys()].sort((a, b) => a.localeCompare(b));
  for (const fname of sortedFiles) {
    const branches = dir.files.get(fname);
    const fpath = dir.path ? dir.path + "/" + fname : fname;
    if (!fileVisible(fpath, branches)) continue;
    count++;
    const partial = branches.size < DATA.branches.length;
    inner += `<li class="file${partial ? " partial" : ""}">
      <div class="node-row${selectedPath === fpath ? " selected" : ""}" data-file="${esc(fpath)}">
        <span class="twist"></span>
        <span class="node-name">${highlight(fname, fpath)}</span>
        ${presenceHTML(branches)}
      </div>
    </li>`;
  }

  return { html: inner, fileCount: count };
}

function renderTree() {
  const r = renderDir(root);
  const el = $("tree-root");
  if (!r.fileCount) {
    el.innerHTML = `<div class="empty">∅ no files match
      ${nameFilter ? `<b>"${esc(nameFilter)}"</b>` : ""}
      ${selectedBranches.size ? "" : "<br>(no branches selected)"}</div>`;
  } else {
    el.innerHTML = `<ul class="tree">${r.html}</ul>`;
  }
  $("visible-count").textContent =
    `${r.fileCount}/${Object.keys(DATA.files).length} files shown`;
}

function renderBranches() {
  $("branches").innerHTML = DATA.branches
    .map((name, i) => {
      const fileCount = Object.values(DATA.files).filter((idxs) => idxs.includes(i)).length;
      return `<label class="branch" style="--bc:${branchColors[i]}">
        <input type="checkbox" data-branch="${i}" ${selectedBranches.has(i) ? "checked" : ""}>
        <span class="box"></span>
        <span class="name" title="${esc(name)}">${esc(name)}</span>
        <span class="count">${fileCount}</span>
      </label>`;
    })
    .join("");
}

function fileUrl(branchName, filePath) {
  if (!DATA.remote_url) return null;
  const allRemotes = DATA.all_remotes || [];
  const originName = DATA.remote_name;
  let ref = branchName;
  if (originName) {
    const originPrefix = originName + "/";
    if (ref.startsWith(originPrefix)) {
      ref = ref.slice(originPrefix.length);
    } else {
      const otherRemote = allRemotes.find((r) => r !== originName && ref.startsWith(r + "/"));
      if (otherRemote) return null;
    }
  }
  const b = ref.split("/").map(encodeURIComponent).join("/");
  const p = filePath.split("/").map(encodeURIComponent).join("/");
  const base = DATA.remote_url;
  if (base.includes("gitlab.com") || base.includes("/gitlab.")) return `${base}/-/blob/${b}/${p}`;
  if (base.includes("bitbucket.org")) return `${base}/src/${b}/${p}`;
  return `${base}/blob/${b}/${p}`;
}

function renderDetail() {
  const el = $("detail");
  if (!selectedPath || !(selectedPath in DATA.files)) {
    el.innerHTML = `<div class="placeholder"><span class="glyph">⌥</span>select a file to see<br>which branches carry it</div>`;
    return;
  }
  const branches = new Set(DATA.files[selectedPath]);
  const slash = selectedPath.lastIndexOf("/");
  const dirPart = slash >= 0 ? selectedPath.slice(0, slash + 1) : "";
  const basePart = slash >= 0 ? selectedPath.slice(slash + 1) : selectedPath;

  const present = [], absent = [];
  DATA.branches.forEach((name, i) => (branches.has(i) ? present : absent).push(i));

  const chip = (i, cls) => {
    const url = cls === "" ? fileUrl(DATA.branches[i], selectedPath) : null;
    const inner = `<div class="chip ${cls}" style="--bc:${branchColors[i]}">
      <span class="swatch"></span><span class="nm">${esc(DATA.branches[i])}</span>
      ${url ? `<span class="ext">↗</span>` : ""}
    </div>`;
    return url
      ? `<a class="chip-link" href="${url}" target="_blank" rel="noopener noreferrer">${inner}</a>`
      : inner;
  };

  el.innerHTML = `
    <h2><span class="path-dim">${esc(dirPart)}</span>${esc(basePart)}</h2>
    <div class="section-label">present on ${present.length} branch${present.length === 1 ? "" : "es"}</div>
    ${present.map((i) => chip(i, "")).join("")}
    ${absent.length
      ? `<div class="section-label">missing from ${absent.length}</div>` + absent.map((i) => chip(i, "absent")).join("")
      : ""}
    ${absent.length
      ? `<div class="allmsg partial">◆ diverges across branches</div>`
      : `<div class="allmsg">● present on every branch</div>`}`;
}

/* ── events ─────────────────────────────────────── */

function wireEvents() {
  $("tree-root").addEventListener("click", (e) => {
    const row = e.target.closest(".node-row");
    if (!row) return;
    if (row.dataset.toggle !== undefined && row.dataset.toggle !== "") {
      const p = row.dataset.toggle;
      collapsed.has(p) ? collapsed.delete(p) : collapsed.add(p);
      row.parentElement.classList.toggle("collapsed");
    } else if (row.dataset.file) {
      selectedPath = row.dataset.file;
      document.querySelectorAll(".node-row.selected").forEach((n) => n.classList.remove("selected"));
      row.classList.add("selected");
      renderDetail();
    }
  });

  $("branches").addEventListener("change", (e) => {
    const cb = e.target.closest("input[data-branch]");
    if (!cb) return;
    const i = Number(cb.dataset.branch);
    cb.checked ? selectedBranches.add(i) : selectedBranches.delete(i);
    renderTree();
  });

  $("all-branches").addEventListener("click", () => {
    selectedBranches = new Set(DATA.branches.map((_, i) => i));
    renderBranches();
    renderTree();
  });
  $("no-branches").addEventListener("click", () => {
    selectedBranches.clear();
    renderBranches();
    renderTree();
  });

  let debounce = null;
  $("search").addEventListener("input", (e) => {
    clearTimeout(debounce);
    debounce = setTimeout(() => {
      nameFilter = e.target.value.trim().toLowerCase();
      renderTree();
    }, 120);
  });

  $("expand-all").addEventListener("click", () => { collapsed.clear(); renderTree(); });
  $("collapse-all").addEventListener("click", () => {
    collapsed = new Set(allDirPaths(root));
    renderTree();
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "/" && document.activeElement !== $("search")) {
      e.preventDefault();
      $("search").focus();
    }
    if (e.key === "Escape") {
      if ($("search").value) { $("search").value = ""; nameFilter = ""; renderTree(); }
      $("search").blur();
    }
  });
}

function allDirPaths(dir, acc = []) {
  for (const sub of dir.dirs.values()) {
    acc.push(sub.path);
    allDirPaths(sub, acc);
  }
  return acc;
}

/* ── boot ───────────────────────────────────────── */

async function boot() {
  try {
    const res = await fetch("/data.json");
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    DATA = await res.json();
  } catch (err) {
    $("tree-root").innerHTML =
      `<div class="empty">could not load /data.json — <b>${esc(String(err.message || err))}</b><br>is the git-ls-tree CLI still running?</div>`;
    return;
  }

  document.title = `git-ls-tree · ${DATA.repo}`;
  branchColors = assignColors(DATA.branches.length);
  selectedBranches = new Set(DATA.branches.map((_, i) => i));
  root = buildTree(DATA.files);

  $("stats").innerHTML =
    `<span>repo <b>${esc(DATA.repo)}</b></span>
     <span><b>${DATA.branches.length}</b> branch${DATA.branches.length === 1 ? "" : "es"}</span>
     <span><b>${Object.keys(DATA.files).length}</b> files</span>`;
  const t = new Date(DATA.generated_at);
  $("stamp").textContent = isNaN(t) ? DATA.generated_at : "snapshot " + t.toLocaleString();

  renderBranches();
  renderTree();
  wireEvents();
}

boot();
</script>
</body>
</html>

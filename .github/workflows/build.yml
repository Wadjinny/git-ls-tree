name: Build package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish as a release (e.g. v0.1.0). Leave empty for a plain build.
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Build wheel and sdist
        run: uv build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: git-ls-tree-dist
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* -R "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/* -R "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --verify-tag
          fi

[project]
name = "git-ls-tree"
version = "0.1.0"
description = "Browse the file tree of a git repository across all branches in a local webpage"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
git-ls-tree = "git_ls_tree.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/git_ls_tree"]
